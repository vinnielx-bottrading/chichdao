# Cloudflare Worker — CHI.CH DAO. API
# Deploy: npx wrangler deploy --config cloudflare/wrangler.toml
name = "chich-dao-api"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[triggers]
crons = ["*/30 * * * *"]   # dọn file chờ xóa trên B2, vị trí hết hạn

[vars]
# --- Supabase: database ---
SUPABASE_URL = "https://oignkueulvvdfhgcvguv.supabase.co"
# --- Backblaze B2: lưu ảnh/video ---
B2_BUCKET = "chich-dao-media"
B2_REGION = "us-west-004"          # lấy từ Endpoint của bucket: s3.<REGION>.backblazeb2.com
# --- Ứng dụng ---
ALLOWED_ORIGINS = "https://chichdao.vercel.app"

# Secrets (KHÔNG ghi vào file này) — đặt bằng `npx wrangler secret put <TÊN> --config cloudflare/wrangler.toml`
#   SUPABASE_SERVICE_ROLE_KEY   Supabase → Project Settings → API Keys → Secret key (sb_secret_...) hoặc service_role
#   B2_KEY_ID                   Backblaze → Application Keys → keyID
#   B2_APPLICATION_KEY          Backblaze → Application Keys → applicationKey
#   MEDIA_SIGNING_SECRET        chuỗi ngẫu nhiên ≥ 32 ký tự (openssl rand -hex 32)
#
# Không bật request logging: link ảnh/video có chữ ký trong URL.
