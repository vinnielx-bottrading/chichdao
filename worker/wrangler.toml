name = "chich-dao-api"
main = "index.js"
compatibility_date = "2026-10-15"
workers_dev = true

[triggers]
crons = ["*/30 * * * *"]

[vars]
ALLOWED_ORIGINS = "https://YOUR_FRONTEND_DOMAIN"
# Set SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, B2_ENDPOINT, B2_REGION,
# B2_BUCKET in Cloudflare dashboard. Set the remaining values as Secrets.
# Deliberately omit observability request logs: media URLs carry signed tokens.
